name: Factory L1 — Proposer

on:
  schedule:
    # 06:00 UTC Tue/Thu/Sat. Proposals land before the workday, not during it.
    - cron: "0 6 * * 2,4,6"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-proposer
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Stage 1 — eligibility. No model: the cap, the declined list, and the
      # duplicate-source check are arithmetic, not judgment.
      - name: Check eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: python3 -m scripts.propose_facts

      # L1's evidence rule requires reading real code, which L0 never needs. Public
      # repos, shallow clones, read-only: the narrator verifies claims against files
      # rather than re-wording L0's summary of them.
      #
      # --no-single-branch, because the user's design work lives on the branches they
      # paused. L1's first live run proposed bespoke per-card effect code for
      # pocket-draft while a spec locking the opposite approach sat on an unmerged
      # branch it could not see. Intent is read from every branch; current code state
      # is still read from the default branch.
      - name: Check out elected repos
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          mkdir -p work
          python3 -c 'from scripts.generate_report import load_elected; print("\n".join(load_elected()))' \
            | while read -r repo; do
            [ -z "$repo" ] && continue
            echo "- cloning $repo"
            gh repo clone "thomas-tahk/$repo" "work/$repo" -- \
              --depth 50 --no-single-branch --quiet

            # Stage 2 runs without Bash, so it cannot query git. Export each
            # non-default branch's documentation to a path it can simply Read.
            # One archive call per path: `git archive` aborts on the whole pathspec
            # if any single entry is missing, and most repos lack at least one.
            default=$(git -C "work/$repo" symbolic-ref --short refs/remotes/origin/HEAD \
              | sed 's|^origin/||')
            git -C "work/$repo" for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | sed 's|^origin/||' | grep -vxE "HEAD|origin|$default" | while read -r br; do
              dest="work/$repo/.branches/$br"
              mkdir -p "$dest"
              for path in docs README.md CLAUDE.md CONTEXT.md AGENTS.md; do
                git -C "work/$repo" archive "origin/$br" "$path" 2>/dev/null \
                  | tar -x -C "$dest" 2>/dev/null || true
              done
              if [ -n "$(ls -A "$dest" 2>/dev/null)" ]; then
                echo "  branch docs: $repo/$br"
              else
                rmdir "$dest" 2>/dev/null || true
              fi
            done
            rmdir "work/$repo/.branches" 2>/dev/null || true
          done

      # Stage 2 — judgment. Deliberately given no token: this step must not be able
      # to reach the GitHub API, so a bad run cannot half-open an issue.
      - name: Write proposals
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow the instructions in .factory/prompts/l1-proposer.md exactly.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --allowedTools Read,Write,Glob,Grep

      # Stage 3 — publish. Re-checks every guard against live state before opening.
      - name: Publish proposals
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: python3 -m scripts.propose_publish
